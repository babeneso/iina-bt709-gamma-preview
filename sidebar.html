<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="sidebarTitle">BT.709 Gamma Preview</title>
  <link rel="stylesheet" href="ui.css">
  <script src="i18n.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="sidebar.js" defer></script>
</head>
<body class="plugin-page" data-page="sidebar">
  <main>
    <h1 data-i18n="appName">BT.709 Gamma Preview</h1>
    <section class="pref-section">
      <p class="secondary" data-i18n-html="iccNote">Enable <strong>Load ICC profile</strong> in <strong>Settings… → Video → Color and HDR</strong> to display the video correctly.</p>
    </section>
    <section class="pref-section">
      <fieldset id="gamma-options">
        <legend data-i18n="playbackLegend">Choose playback gamma for this video:</legend>
        <label>
          <input type="radio" name="playbackGamma" value="na" disabled checked>
          <span data-playback-status data-i18n="noVideo">No video playing</span>
        </label>
        <label hidden>
          <input type="radio" name="playbackGamma" value="mpv" disabled>
          <span data-i18n="mode.mpv">BT.1886 (mpv default)</span>
        </label>
        <label hidden>
          <input type="radio" name="playbackGamma" value="qt" disabled>
          <span data-i18n="mode.qt">Gamma ≈1.961 (QuickTime-like)</span>
        </label>
        <label hidden>
          <input type="radio" name="playbackGamma" value="gamma22" disabled>
          <span data-i18n="mode.gamma22">Gamma 2.2</span>
        </label>
        <label hidden>
          <input type="radio" name="playbackGamma" value="gamma24" disabled>
          <span data-i18n="mode.gamma24">Gamma 2.4</span>
        </label>
      </fieldset>
    </section>
    <hr>
    <section class="pref-section">
      <p class="small secondary" data-i18n-html="sidebarDefault">To change the default for this option, go to <strong>Settings… → Plugins → BT.709 Gamma Preview → ⓘ button</strong>.</p>
    </section>
  </main>
</body>
</html>
